<!doctype html>
<html lang="ar" dir="rtl">
<head>
<link rel="icon" type="image/png" href="assets/images/milestones-logo.png">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Milestones Group — إدارة الموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/images/app-icon-192.png">
<meta name="theme-color" content="#29235F">
<meta name="application-name" content="Milestones Group">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/brand.css">
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <section class="login-visual">
    <div class="brand brand-logo-only"><img class="brand-full-logo" src="assets/images/milestones-full-logo-light.png" alt="شعار Milestones Group"></div>
    <h1>إدارة أذكى.<br><span style="color:#BED73B">فريق أقوى.</span></h1>
    <p>تابع فريقك بسهولة من منصة واحدة للحضور والإجازات والرواتب.</p>
    <div class="feature-list"><span><i class="fa-solid fa-chart-line"></i> قرارات مبنية على بيانات لحظية</span><span><i class="fa-solid fa-shield-halved"></i> صلاحيات واضحة لكل دور</span><span><i class="fa-solid fa-wand-magic-sparkles"></i> تجربة SaaS بسيطة ومريحة</span></div>
  </section>
  <section class="login-panel">
    <div class="brand brand-logo-only"><img class="brand-full-logo" src="assets/images/milestones-full-logo.png" alt="شعار Milestones Group"></div>
    <h2>مرحبًا بعودتك</h2>
    <p class="sub">استخدم بريدك الإلكتروني أو كود الموظف للدخول</p>
    <div id="loginError" class="login-error hidden"></div>
    <form id="loginForm">
      <div class="form-group"><label>البريد الإلكتروني أو كود الموظف</label><input id="email" class="form-control ltr" type="text" inputmode="email" autocomplete="username" placeholder="name@company.com أو كود الموظف" required></div>
      <div class="form-group"><label>كلمة المرور</label>
        <div class="password-wrap"><input id="password" class="form-control ltr" type="password" autocomplete="current-password" placeholder="••••••" required><button type="button" id="togglePassword"><i class="fa-regular fa-eye"></i></button></div>
      </div>
      <div class="login-row"><label class="check"><input type="checkbox" id="remember"> تذكرني</label><span class="link" onclick="openForgotPassword()">نسيت كلمة المرور؟</span></div><button id="loginSubmit" class="primary-btn" style="width:100%;padding:14px" type="submit"><i class="fa-solid fa-arrow-left-to-bracket"></i> تسجيل الدخول</button>
    </form>
    <button class="install-btn" type="button" onclick="installApp()"><i class="fa-solid fa-download"></i> تثبيت التطبيق على الجهاز</button>
  </section>
</div>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand brand-logo-only"><img class="brand-full-logo" src="assets/images/milestones-full-logo-light.png" alt="شعار Milestones Group"></div>
    <nav id="nav"></nav>
    <div class="sidebar-bottom">
      <div class="nav-item" onclick="openPage('settings')"><i class="fa-solid fa-gear"></i> الإعدادات</div>
      <button class="install-btn" type="button" onclick="installApp()"><i class="fa-solid fa-download"></i> تثبيت التطبيق</button>
      <div class="nav-item" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center"><button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fa-solid fa-bars"></i></button>
        <div class="top-title" id="topTitle">لوحة التحكم</div>
      </div>
      <div class="top-actions"><button class="icon-btn" onclick="toggleDark()"><i class="fa-solid fa-moon"></i></button><button class="icon-btn" onclick="showNotifications()"><i class="fa-regular fa-bell"></i><span id="notifDot" class="dot hidden"></span></button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">م</div>
          <div><b id="userName">محمد أحمد</b><small class="muted" id="userRole">مدير النظام</small></div>
        </div>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>
<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div id="modal" class="modal"></div>
</div>
<div id="toastWrap" class="toast-wrap"></div>
<script src="assets/js/app.js"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));</script>
</body>
</html>
